<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Thư viện</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {
            width: 380px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #1976d2;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #1976d2;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="register-box">

        <h2>Đăng ký tài khoản</h2>

        <form id="registerForm">

            <div class="form-group">

                <label>Tên đăng nhập</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Nhập email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Mật khẩu</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required
                >

            </div>


            <button type="submit">
                Đăng ký
            </button>

        </form>


        <div id="message"></div>


        <div class="login">

            Đã có tài khoản?

            <a href="/login.html">
                Đăng nhập
            </a>

        </div>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                const message =
                    document.getElementById("message");


                try {

                    const response = await fetch(
                        "/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data = await response.json();


                    if (data.success) {

                        message.innerText =
                            "Đăng ký thành công!";

                        message.style.color = "green";


                        setTimeout(function() {

                            window.location.href =
                                "/login.html";

                        }, 1000);

                    } else {

                        message.innerText =
                            data.message || "Đăng ký thất bại";

                        message.style.color = "red";

                    }


                } catch (error) {

                    console.error(error);

                    message.innerText =
                        "Không thể kết nối đến server";

                    message.style.color = "red";

                }

            });

    </script>

</body>

</html>
