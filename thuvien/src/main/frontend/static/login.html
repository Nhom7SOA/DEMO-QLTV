<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Thư viện</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #1976d2;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #1976d2;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        .register {
            text-align: center;

            margin-top: 20px;
        }

        .register a {
            color: #1976d2;

            text-decoration: none;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Đăng nhập</h2>

        <form id="loginForm">

            <div class="form-group">

                <label>Tên đăng nhập</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                >

            </div>

            <div class="form-group">

                <label>Mật khẩu</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required
                >

            </div>

            <button type="submit">
                Đăng nhập
            </button>

        </form>

        <div id="message"></div>

        <div class="register">

            Chưa có tài khoản?

            <a href="/register.html">
                Đăng ký
            </a>

        </div>

    </div>


    <script>

        document.getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const response = await fetch("/api/auth/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            username: username,

                            password: password

                        })

                    });


                    const data = await response.json();


                    if (data.success) {

                        // Lưu thông tin đăng nhập
                        localStorage.setItem(
                            "username",
                            data.username
                        );

                        localStorage.setItem(
                            "role",
                            data.role
                        );


                        // Đăng nhập thành công
                        window.location.href = "/index.html";

                    } else {

                        // Đăng nhập thất bại
                        document.getElementById("message").innerText =
                            data.message;

                    }


                } catch (error) {

                    document.getElementById("message").innerText =
                        "Không thể kết nối đến server";

                }

            });

    </script>

</body>

</html>
